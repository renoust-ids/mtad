name: Build & Release

on:
  push:
    branches: [main, master, feat/celledit, improveui, histograms, feat/splom]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install -g lerna@4
      - run: lerna bootstrap --force-local --hoist --no-ci --ignore-prepublish
      - name: Build reltab
        run: cd packages/reltab && npx tsc -p tsconfig-build.json
      - name: Build aggtree
        run: cd packages/aggtree && npx tsc -p tsconfig-build.json
      - name: Build reltab-duckdb
        run: cd packages/reltab-duckdb && npx tsc -p tsconfig-build.json
      - name: Build reltab-fs
        run: cd packages/reltab-fs && npx tsc -p tsconfig-build.json
      - name: Build reltab-bigquery
        run: cd packages/reltab-bigquery && npx tsc
      - name: Build tadviewer
        run: cd packages/tadviewer && npx webpack --mode production
      - name: Build tad-app
        run: cd packages/tad-app && npm run build-assets && npx webpack --mode production
      - name: Clean dist before packaging
        shell: bash
        run: cd packages/tad-app && rm -rf dist/mac dist/mac-arm64 dist/win dist/win-unpacked dist/linux dist/linux-unpacked && rm -f dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-*.yml 2>/dev/null; true
      - name: Package Mac (arm64 only)
        run: cd packages/tad-app && npx electron-builder --mac --arm64 --publish=never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: |
            packages/tad-app/dist/*.dmg
            packages/tad-app/dist/*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install -g lerna@4
      - run: lerna bootstrap --force-local --hoist --no-ci --ignore-prepublish
      - name: Build reltab
        run: cd packages/reltab && npx tsc -p tsconfig-build.json
      - name: Build aggtree
        run: cd packages/aggtree && npx tsc -p tsconfig-build.json
      - name: Build reltab-duckdb
        run: cd packages/reltab-duckdb && npx tsc -p tsconfig-build.json
      - name: Build reltab-fs
        run: cd packages/reltab-fs && npx tsc -p tsconfig-build.json
      - name: Build reltab-bigquery
        run: cd packages/reltab-bigquery && npx tsc
      - name: Build tadviewer
        run: cd packages/tadviewer && npx webpack --mode production
      - name: Build tad-app
        run: cd packages/tad-app && npm run build-assets && npx webpack --mode production
      - name: Clean dist before packaging
        shell: bash
        run: cd packages/tad-app && rm -rf dist/mac dist/mac-arm64 dist/win dist/win-unpacked dist/linux dist/linux-unpacked && rm -f dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-*.yml 2>/dev/null; true
      - name: Package Windows
        run: cd packages/tad-app && npx electron-builder --win --publish=never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: packages/tad-app/dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm install -g lerna@4
      - run: lerna bootstrap --force-local --hoist --no-ci --ignore-prepublish
      - name: Build reltab
        run: cd packages/reltab && npx tsc -p tsconfig-build.json
      - name: Build aggtree
        run: cd packages/aggtree && npx tsc -p tsconfig-build.json
      - name: Build reltab-duckdb
        run: cd packages/reltab-duckdb && npx tsc -p tsconfig-build.json
      - name: Build reltab-fs
        run: cd packages/reltab-fs && npx tsc -p tsconfig-build.json
      - name: Build reltab-bigquery
        run: cd packages/reltab-bigquery && npx tsc
      - name: Build tadviewer
        run: cd packages/tadviewer && npx webpack --mode production
      - name: Build tad-app
        run: cd packages/tad-app && npm run build-assets && npx webpack --mode production
      - name: Clean dist before packaging
        shell: bash
        run: cd packages/tad-app && rm -rf dist/mac dist/mac-arm64 dist/win dist/win-unpacked dist/linux dist/linux-unpacked && rm -f dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-*.yml 2>/dev/null; true
      - name: Package Linux
        run: cd packages/tad-app && npx electron-builder --linux deb rpm tar.bz2 --publish=never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            packages/tad-app/dist/*.deb
            packages/tad-app/dist/*.rpm
            packages/tad-app/dist/*.tar.bz2

  release:
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          body="$(awk -v ver="$version" 'BEGIN{found=0} /^## \[/ { if (index($0, "[" ver "]") == 4) { found=1; next } if (found) exit } found {print}' CHANGELOG.md)"
          echo "RELEASE_BODY<<DELIMITER_MY_HEREDOC" >> "$GITHUB_ENV"
          echo "$body" >> "$GITHUB_ENV"
          echo "DELIMITER_MY_HEREDOC" >> "$GITHUB_ENV"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mac-builds/*
            windows-builds/*
            linux-builds/*
          body: ${{ env.RELEASE_BODY }}
          make_latest: true
          generate_release_notes: true
